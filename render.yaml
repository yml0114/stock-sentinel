databases:
  - name: stock-sentinel-db
    plan: free
    databaseName: stock_sentinel
    ipAllowList: []

services:
  - type: web
    name: stock-sentinel
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        value: https://api.tokex.top/v1
      - key: AI_MODEL
        value: deepseek-ai/deepseek-v4-pro
      - key: PYTHON_VERSION
        value: 3.11.0
